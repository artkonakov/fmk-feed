<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="format-detection" content="telephone=no">
    <title>Лента</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,400..800&family=Roboto:wght@500&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/maplibre-gl@6.9.1/dist/maplibre-gl.css" rel="stylesheet">

  <body>
    <div id="app">
      <!-- ============ MENU ============ -->
      <div class="view" id="menuView" hidden>
        <header class="menu-header">Лента</header>
        <div class="menu-content">
          <div class="list-card" id="menuList"></div>
        </div>
      </div>

      <!-- ============ PROTOTYPE ============ -->
      <div class="view" id="protoView" hidden>

          <button class="nav-btn" id="backBtn" type="button" aria-label="Назад">

          <div class="nav-title" id="childTitle"></div>
          <button class="nav-btn" id="refreshBtn" type="button" aria-label="Обновить">
            <img src="assets/icon-24-refresh-1.svg" width="24" height="24" alt="">
          </button>
        </header>
        <main class="feed" id="feed"></main>
      </div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
    <script type="module" src="src/app.js?v=32"></script>
